services:
  # Schema initialization service (runs once, like K8s init container)
  temporal-schema-setup:
    container_name: temporal-schema-setup
    image: temporalio/admin-tools:${TEMPORAL_ADMIN_VERSION:-1.28}
    external_links:
      - postgresql:postgresql
    env_file:
      - .env.local
    entrypoint: []
    labels:
      - "com.docker.compose.type=init"
      - "description=One-time schema initialization (will show as Exited - this is normal)"
    command:
      - /bin/sh
      - -c
      - |
        echo "⏳ Waiting for PostgreSQL..."
        until nc -z postgresql 5432; do
          sleep 2
        done
        echo "✅ PostgreSQL is ready!"
        
        echo "🔨 Initializing Temporal schema..."
        temporal-sql-tool \
          --plugin postgres12 \
          --ep postgresql \
          --port 5432 \
          --db temporal \
          --user "$${POSTGRES_USER}" \
          --password "$${POSTGRES_PASSWORD}" \
          setup-schema -v 0.0
        
        temporal-sql-tool \
          --plugin postgres12 \
          --ep postgresql \
          --port 5432 \
          --db temporal_visibility \
          --user "$${POSTGRES_USER}" \
          --password "$${POSTGRES_PASSWORD}" \
          setup-schema -v 0.0
        
        echo "🔨 Updating schemas to latest version..."
        temporal-sql-tool \
          --plugin postgres12 \
          --ep postgresql \
          --port 5432 \
          --db temporal \
          --user "$${POSTGRES_USER}" \
          --password "$${POSTGRES_PASSWORD}" \
          update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        
        temporal-sql-tool \
          --plugin postgres12 \
          --ep postgresql \
          --port 5432 \
          --db temporal_visibility \
          --user "$${POSTGRES_USER}" \
          --password "$${POSTGRES_PASSWORD}" \
          update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
        
        echo "✅ Schema initialization complete!"
    networks:
      - xians-community-edition
    restart: "no"

  # Namespace registration service (runs once after Temporal server starts)
  temporal-namespace-setup:
    container_name: temporal-namespace-setup
    image: temporalio/admin-tools:${TEMPORAL_ADMIN_VERSION:-1.28}
    env_file:
      - .env.local
    entrypoint: []
    labels:
      - "com.docker.compose.type=init"
      - "description=One-time namespace registration (will show as Exited - this is normal)"
    command:
      - /bin/sh
      - -c
      - |
        echo "⏳ Waiting for Temporal server to be ready..."
        until temporal operator cluster health \
          --address temporal:7233 \
          --tls-cert-path ${TEMPORAL_UI_CERT} \
          --tls-key-path ${TEMPORAL_UI_KEY} \
          --tls-ca-path ${TEMPORAL_CA_CERT} 2>/dev/null | grep -q "SERVING"; do
          echo "  Temporal not ready yet, retrying..."
          sleep 3
        done
        echo "✅ Temporal server is ready!"
        
        echo "🏷️  Checking if namespace '$${TEMPORAL_NAMESPACE}' exists..."
        if temporal operator namespace describe \
          --address temporal:7233 \
          --tls-cert-path ${TEMPORAL_UI_CERT} \
          --tls-key-path ${TEMPORAL_UI_KEY} \
          --tls-ca-path ${TEMPORAL_CA_CERT} \
          --namespace "$${TEMPORAL_NAMESPACE}" >/dev/null 2>&1; then
          echo "✅ Namespace '$${TEMPORAL_NAMESPACE}' already exists"
        else
          echo "📝 Registering namespace '$${TEMPORAL_NAMESPACE}'..."
          temporal operator namespace create \
            --address temporal:7233 \
            --tls-cert-path ${TEMPORAL_UI_CERT} \
            --tls-key-path ${TEMPORAL_UI_KEY} \
            --tls-ca-path ${TEMPORAL_CA_CERT} \
            --namespace "$${TEMPORAL_NAMESPACE}" \
            --retention "$${TEMPORAL_NAMESPACE_RETENTION_DAYS}d" \
            --description "XiansAI Platform Workflows" \
            --email "platform@xiansai.io"
          echo "✅ Namespace '$${TEMPORAL_NAMESPACE}' registered successfully!"
        fi
    volumes:
      - ./certs:/etc/temporal/certs:ro
    depends_on:
      temporal:
        condition: service_started
    networks:
      - xians-community-edition
    restart: "no"

  # Elasticsearch setup service (runs once after Elasticsearch is ready)
  temporal-elasticsearch-setup:
    container_name: temporal-elasticsearch-setup
    image: curlimages/curl:latest
    labels:
      - "com.docker.compose.type=init"
      - "description=One-time Elasticsearch index setup (will show as Exited - this is normal)"
    command:
      - /bin/sh
      - -c
      - |
        echo "⏳ Waiting for Elasticsearch to be ready..."
        until curl -s "http://elasticsearch:9200/_cluster/health" > /dev/null; do
          echo "  Elasticsearch not ready yet, retrying..."
          sleep 3
        done
        echo "✅ Elasticsearch is ready!"
        
        echo "📊 Setting up Elasticsearch index and template for Temporal visibility..."
        
        # Create index template
        echo "  Creating index template..."
        curl -X PUT "http://elasticsearch:9200/_template/temporal_visibility_v1_template" \
          -H 'Content-Type: application/json' \
          -d '{
            "index_patterns": ["temporal_visibility_v1_*"],
            "settings": {
              "index": {
                "number_of_shards": 1,
                "number_of_replicas": 0
              }
            },
            "mappings": {
              "properties": {
                "VisibilityTaskKey": {
                  "type": "keyword"
                },
                "RunId": {
                  "type": "keyword"
                },
                "WorkflowId": {
                  "type": "keyword"
                },
                "WorkflowType": {
                  "type": "keyword"
                },
                "StartTime": {
                  "type": "date",
                  "format": "strict_date_optional_time||epoch_millis"
                },
                "ExecutionTime": {
                  "type": "date",
                  "format": "strict_date_optional_time||epoch_millis"
                },
                "CloseTime": {
                  "type": "date",
                  "format": "strict_date_optional_time||epoch_millis"
                },
                "ExecutionStatus": {
                  "type": "keyword"
                },
                "TaskQueue": {
                  "type": "keyword"
                },
                "HistoryLength": {
                  "type": "long"
                },
                "Encoding": {
                  "type": "keyword"
                },
                "KnownEncoding": {
                  "type": "keyword"
                },
                "Memo": {
                  "type": "object",
                  "enabled": false
                },
                "SearchAttributes": {
                  "type": "object",
                  "dynamic": true
                }
              }
            }
          }'
        
        echo "  ✅ Index template created successfully!"
        
        # Create the index (if it doesn't exist)
        echo "  Creating index: temporal_visibility_v1_dev"
        response=$$(curl -s -X PUT "http://elasticsearch:9200/temporal_visibility_v1_dev" \
          -H 'Content-Type: application/json' \
          -d '{
            "settings": {
              "index": {
                "number_of_shards": 1,
                "number_of_replicas": 0
              }
            }
          }')
        
        if echo "$$response" | grep -q "resource_already_exists_exception"; then
          echo "  ✅ Index already exists (skipping creation)"
        elif echo "$$response" | grep -q "acknowledged.*true"; then
          echo "  ✅ Index created successfully!"
        else
          echo "  ⚠️  Index creation response: $$response"
        fi
        
        echo "✅ Elasticsearch setup complete!"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - xians-community-edition
    restart: "no"

  # Search attributes setup service (runs once after namespace is ready)
  temporal-search-attributes-setup:
    container_name: temporal-search-attributes-setup
    image: temporalio/admin-tools:${TEMPORAL_ADMIN_VERSION:-1.28}
    env_file:
      - .env.local
    entrypoint: []
    labels:
      - "com.docker.compose.type=init"
      - "description=One-time search attributes setup (will show as Exited - this is normal)"
    command:
      - /bin/sh
      - -c
      - |
        echo "⏳ Waiting for Temporal server and namespace to be ready..."
        until temporal operator namespace describe \
          --address temporal:7233 \
          --tls-cert-path ${TEMPORAL_UI_CERT} \
          --tls-key-path ${TEMPORAL_UI_KEY} \
          --tls-ca-path ${TEMPORAL_CA_CERT} \
          --namespace "$${TEMPORAL_NAMESPACE}" >/dev/null 2>&1; do
          echo "  Namespace not ready yet, retrying..."
          sleep 3
        done
        echo "✅ Temporal namespace is ready!"
        
        echo "🏷️  Setting up XiansAi custom search attributes..."
        
        # Check existing search attributes
        echo "  Checking existing search attributes..."
        existing_attrs=$$(temporal operator cluster describe \
          --address temporal:7233 \
          --tls-cert-path $${TEMPORAL_UI_CERT} \
          --tls-key-path $${TEMPORAL_UI_KEY} \
          --tls-ca-path $${TEMPORAL_CA_CERT} 2>/dev/null | grep -A 20 "search_attributes" || echo "")
        
        # Add missing search attributes
        if ! echo "$$existing_attrs" | grep -q "tenantId"; then
          echo "  - Adding tenantId (Keyword)..."
          temporal operator search-attribute create \
            --name "tenantId" --type "Keyword" \
            --address temporal:7233 \
            --tls-cert-path ${TEMPORAL_UI_CERT} \
            --tls-key-path ${TEMPORAL_UI_KEY} \
            --tls-ca-path ${TEMPORAL_CA_CERT} 2>/dev/null || echo "    ⚠️  tenantId registration failed"
        else
          echo "  ✓ tenantId already exists"
        fi
        
        if ! echo "$$existing_attrs" | grep -q "userId"; then
          echo "  - Adding userId (Keyword)..."
          temporal operator search-attribute create \
            --name "userId" --type "Keyword" \
            --address temporal:7233 \
            --tls-cert-path ${TEMPORAL_UI_CERT} \
            --tls-key-path ${TEMPORAL_UI_KEY} \
            --tls-ca-path ${TEMPORAL_CA_CERT} 2>/dev/null || echo "    ⚠️  userId registration failed"
        else
          echo "  ✓ userId already exists"
        fi
        
        if ! echo "$$existing_attrs" | grep -q "agent"; then
          echo "  - Adding agent (Keyword)..."
          temporal operator search-attribute create \
            --name "agent" --type "Keyword" \
            --address temporal:7233 \
            --tls-cert-path ${TEMPORAL_UI_CERT} \
            --tls-key-path ${TEMPORAL_UI_KEY} \
            --tls-ca-path ${TEMPORAL_CA_CERT} 2>/dev/null || echo "    ⚠️  agent registration failed"
        else
          echo "  ✓ agent already exists"
        fi
        
        if ! echo "$$existing_attrs" | grep -q "systemScoped"; then
          echo "  - Adding systemScoped (Bool)..."
          temporal operator search-attribute create \
            --name "systemScoped" --type "Bool" \
            --address temporal:7233 \
            --tls-cert-path ${TEMPORAL_UI_CERT} \
            --tls-key-path ${TEMPORAL_UI_KEY} \
            --tls-ca-path ${TEMPORAL_CA_CERT} 2>/dev/null || echo "    ⚠️  systemScoped registration failed"
        else
          echo "  ✓ systemScoped already exists"
        fi
        
        echo "✅ Search attributes setup complete!"
    volumes:
      - ./certs:/etc/temporal/certs:ro
    depends_on:
      temporal-namespace-setup:
        condition: service_completed_successfully
      temporal-elasticsearch-setup:
        condition: service_completed_successfully
    networks:
      - xians-community-edition
    restart: "no"

  elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.18
    environment:
      - cluster.name=temporal-elasticsearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.monitoring.enabled=false
      - xpack.graph.enabled=false
      - xpack.watcher.enabled=false
      - xpack.ml.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    networks:
      - xians-community-edition
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  temporal:
    container_name: temporal
    hostname: temporal
    external_links:
      - postgresql:postgresql
    env_file:
      - .env.local
    environment:
      # Database configuration
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgresql
      # Elasticsearch configuration
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
      # Services to run (all-in-one)
      - SERVICES=frontend,matching,history,worker
      # TLS/mTLS Configuration (via custom config_template.yaml)
      - TEMPORAL_TLS_REQUIRE_CLIENT_AUTH=true
      # Server certificates (for internode communication)
      - TEMPORAL_TLS_SERVER_CERT=/etc/temporal/certs/temporal.crt
      - TEMPORAL_TLS_SERVER_KEY=/etc/temporal/certs/temporal.key
      - TEMPORAL_TLS_SERVER_CA_CERT=/etc/temporal/certs/ca.crt
      # Frontend certificates (for external clients - SDK, temporal CLI, UI)
      - TEMPORAL_TLS_FRONTEND_CERT=/etc/temporal/certs/temporal.crt
      - TEMPORAL_TLS_FRONTEND_KEY=/etc/temporal/certs/temporal.key
      - TEMPORAL_TLS_CLIENT1_CA_CERT=/etc/temporal/certs/ca.crt
      # TLS ServerName for internal clients (use hostname not IP)
      - TEMPORAL_TLS_FRONTEND_SERVER_NAME=temporal
      - TEMPORAL_TLS_INTERNODE_SERVER_NAME=temporal
      # Internal client certificates for mTLS (custom template feature)
      - TEMPORAL_TLS_INTERNODE_CLIENT_CERT=/etc/temporal/certs/temporal.crt
      - TEMPORAL_TLS_INTERNODE_CLIENT_KEY=/etc/temporal/certs/temporal.key
      - TEMPORAL_TLS_WORKER_CLIENT_CERT=/etc/temporal/certs/temporal.crt
      - TEMPORAL_TLS_WORKER_CLIENT_KEY=/etc/temporal/certs/temporal.key
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    # Production-ready Temporal server image
    image: temporalio/server:${TEMPORAL_VERSION}
    networks:
      - xians-community-edition
    ports:
      - 7233:7233
    volumes:
      - ./certs:/etc/temporal/certs:ro
      - ./config/config_template.yaml:/etc/temporal/config/config_template.yaml:ro  # Custom template with mTLS support
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig  # Runtime config overrides
  # Removed temporal-admin-tools - not needed with auto-setup image
  # You can access admin tools by running: docker exec -it temporal temporal operator cluster health
  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    env_file:
      - .env.local
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_DEFAULT_NAMESPACE=${TEMPORAL_NAMESPACE:-xiansai}
      - TEMPORAL_AUTH_ENABLED=true
      - TEMPORAL_AUTH_PROVIDER_URL=${AUTH_HOST}/realms/xiansai
      - TEMPORAL_AUTH_ISSUER_URL=${AUTH_HOST}/realms/xiansai
      - TEMPORAL_AUTH_CLIENT_ID=temporal-ui
      - TEMPORAL_AUTH_CLIENT_SECRET=${TEMPORAL_UI_CLIENT_SECRET}
      - TEMPORAL_AUTH_CALLBACK_URL=${TEMPORAL_HOST}/auth/sso/callback
      - TEMPORAL_AUTH_SCOPES=openid,profile,email
      # mTLS Client Configuration - UI connects to Temporal server
      - TEMPORAL_TLS_CA_CERT=${TEMPORAL_CA_CERT}        # CA to trust server
      - TEMPORAL_TLS_CERT=${TEMPORAL_UI_CERT}           # Client certificate (CN: temporal-ui)
      - TEMPORAL_TLS_KEY=${TEMPORAL_UI_KEY}             # Client private key
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    networks:
      - xians-community-edition
    ports:
      - 8080:8080
    volumes:
      - ./certs:/etc/temporal/certs:ro
networks:
  xians-community-edition:
    external: true
    name: xians-community-edition-network

volumes:
  elasticsearch_data:
    name: temporal-elasticsearch-data
    driver: local
